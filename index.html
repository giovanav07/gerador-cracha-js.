<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Crachá</title>
</head>
<body>
    <h1>Gerador de Crachá</h1>
    <p>Abra a console (F12) para ver o resultado.</p>

    <script>

    let nome = String(prompt("Nome:"));

    let sobrenome = String(prompt("Sobrenome:"));

    let anodenascimento = Number(prompt("Ano de nascimento:"));

    let confirmacao = Boolean(confirm("É aluno ativo da instituição?"));

    // Parte do processamento
    let idade = 2026 - anodenascimento;

    let sobrenomeMaiusculo = sobrenome.toUpperCase();

    let quantidadeLetras = nome.length;

    // Parte da saída
    console.log("CRACHÁ VIRTUAL: " + sobrenomeMaiusculo + ", " + nome);

    console.log("Idade estimada: " + idade + " anos.");

    console.log("O seu primeiro nome tem " + quantidadeLetras + " letras.");

    console.log("Estatuto de aluno ativo: " + confirmacao);

    </script>
</body>
</html>
